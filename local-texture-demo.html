<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Working Wood Texture Cube – Babylon.js</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script>
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);

      const createScene = () => {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.1);

        // Camera
        const camera = new BABYLON.ArcRotateCamera(
          "camera",
          -Math.PI / 4,
          Math.PI / 3,
          8,
          BABYLON.Vector3.Zero(),
          scene,
        );
        camera.attachControl(canvas, true);

        // Lighting
        const light = new BABYLON.HemisphericLight(
          "light",
          new BABYLON.Vector3(0, 1, 0),
          scene,
        );
        light.intensity = 1.2;

        // Ground
        const ground = BABYLON.MeshBuilder.CreateGround(
          "ground",
          { width: 10, height: 10 },
          scene,
        );
        const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
        groundMat.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.8);
        ground.material = groundMat;

        // Cube
        const box = BABYLON.MeshBuilder.CreateBox("box", { size: 2 }, scene);
        box.position.y = 1;

        // Wood material using a VERIFIED hosted image
        const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
        woodMat.diffuseTexture = new BABYLON.Texture(
          "https://i.imgur.com/Wi7W9YU.jpg",
          scene,
        ); // Public wood image
        woodMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
        woodMat.emissiveColor = new BABYLON.Color3(0, 0, 0);
        box.material = woodMat;

        return scene;
      };

      const scene = createScene();
      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    </script>
  </body>
</html>
